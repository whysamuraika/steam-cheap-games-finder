<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Segoe UI,Arial,sans-serif">
  <rect width="760" height="260" rx="12" fill="#1b2838"/>
  <text x="380" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">Step 2 — Open chrome://extensions and enable Developer mode</text>
  <!-- browser -->
  <rect x="40" y="55" width="680" height="185" rx="10" fill="#f1f3f4"/>
  <rect x="40" y="55" width="680" height="40" rx="10" fill="#dfe1e5"/>
  <rect x="75" y="63" width="400" height="24" rx="12" fill="#fff"/>
  <text x="95" y="80" fill="#202124" font-size="13" font-weight="600">chrome://extensions</text>
  <!-- header -->
  <rect x="40" y="95" width="680" height="45" fill="#3c4a63"/>
  <text x="60" y="124" fill="#fff" font-size="15">Extensions</text>
  <text x="560" y="123" fill="#fff" font-size="13">Developer mode</text>
  <rect x="660" y="110" width="40" height="22" rx="11" fill="#8ab4f8"/>
  <circle cx="689" cy="121" r="8" fill="#1a3a6b"/>
  <!-- highlight -->
  <rect x="545" y="102" width="165" height="38" rx="8" fill="none" stroke="#e5342b" stroke-width="3"/>
  <path d="M600 190 L610 150" stroke="#e5342b" stroke-width="3" stroke-linecap="round"/>
  <path d="M600 150 l10 0 l-5 -10z" fill="#e5342b" transform="translate(-3 12)"/>
  <text x="520" y="205" fill="#e5342b" font-size="14" font-weight="600">Turn this toggle ON (top-right)</text>
  <text x="60" y="215" fill="#5f6368" font-size="12">Type the address in the address bar and press Enter.</text>
</svg>
