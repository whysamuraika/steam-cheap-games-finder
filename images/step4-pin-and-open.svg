<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Segoe UI,Arial,sans-serif">
  <rect width="760" height="260" rx="12" fill="#1b2838"/>
  <text x="380" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">Step 4 — Pin the extension and open it</text>
  <rect x="40" y="55" width="680" height="40" rx="10" fill="#dfe1e5"/>
  <rect x="60" y="63" width="380" height="24" rx="12" fill="#fff"/>
  <text x="78" y="80" fill="#5f6368" font-size="12">store.steampowered.com</text>
  <!-- puzzle -->
  <rect x="590" y="62" width="30" height="26" rx="6" fill="#c7c9cc"/>
  <text x="605" y="82" text-anchor="middle" font-size="16">🧩</text>
  <!-- dropdown -->
  <rect x="440" y="100" width="270" height="105" rx="8" fill="#fff" stroke="#c7c9cc"/>
  <text x="456" y="124" fill="#202124" font-size="13" font-weight="600">Extensions</text>
  <text x="456" y="152" fill="#202124" font-size="13">🎮 Steam Cheap Finder</text>
  <text x="676" y="152" font-size="15">📌</text>
  <rect x="448" y="134" width="254" height="26" rx="4" fill="none" stroke="#e5342b" stroke-width="2.5"/>
  <text x="456" y="185" fill="#5f6368" font-size="11">Click the pin to keep the icon on the toolbar.</text>
  <text x="60" y="140" fill="#c7d5e0" font-size="14">1. Click the 🧩 puzzle icon</text>
  <text x="60" y="165" fill="#c7d5e0" font-size="14">2. Pin “Steam Cheap Finder”</text>
  <text x="60" y="190" fill="#75b022" font-size="14" font-weight="600">3. Click its icon — the app opens in a new tab</text>
</svg>
