<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="260" rx="12" fill="#1b2838"/>
  <text x="380" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">Step 1 — Unzip the downloaded archive</text>
  <!-- zip -->
  <rect x="60" y="80" width="130" height="110" rx="8" fill="#2e4259"/>
  <rect x="115" y="80" width="20" height="110" fill="#66c0f4" opacity=".6"/>
  <text x="125" y="215" text-anchor="middle" fill="#c7d5e0" font-size="13">steam-cheap-finder.zip</text>
  <!-- arrow -->
  <path d="M215 135 H305" stroke="#75b022" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M292 120 L310 135 L292 150" stroke="#75b022" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="260" y="112" text-anchor="middle" fill="#8aa1b4" font-size="12">Extract all…</text>
  <!-- folder -->
  <path d="M340 90 h60 l14 16 h120 a8 8 0 0 1 8 8 v90 a8 8 0 0 1 -8 8 h-194 a8 8 0 0 1 -8 -8 v-106 a8 8 0 0 1 8 -8z" fill="#e8b83c"/>
  <text x="437" y="158" text-anchor="middle" fill="#3b2f0a" font-size="15" font-weight="700">steam-cheap-finder</text>
  <!-- files -->
  <rect x="580" y="75" width="150" height="130" rx="8" fill="#0e1722" stroke="#2e4259"/>
  <g fill="#c7d5e0" font-size="12">
    <text x="595" y="100" fill="#75b022" font-weight="600">manifest.json ✔</text>
    <text x="595" y="122">app.html</text>
    <text x="595" y="142">app.js · web.js</text>
    <text x="595" y="162">app.css · rules.json</text>
    <text x="595" y="182">background.js</text>
  </g>
  <text x="380" y="248" text-anchor="middle" fill="#8aa1b4" font-size="12">Keep the folder somewhere permanent — Chrome loads the extension from it.</text>
</svg>
